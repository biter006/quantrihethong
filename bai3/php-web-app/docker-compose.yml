# Bài lab 3 — Điều phối hệ thống với Docker Compose
# Gom toàn bộ hệ thống của Bài lab 2 vào một file, bổ sung Redis làm cache.
# Chạy:  docker compose up -d --build

services:

  # ---------- CƠ SỞ DỮ LIỆU ----------
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - php-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- CACHE ----------
  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - php-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- ỨNG DỤNG WEB ----------
  php-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: php-web-app:3.0
    container_name: php-web
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT}:80"
    environment:
      DB_HOST: mysql-db
      DB_NAME: ${MYSQL_DATABASE}
      DB_PASS: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASSWORD}
      CACHE_TTL: ${CACHE_TTL}
    networks:
      - php-network

networks:
  php-network:
    driver: bridge
    name: php-network

volumes:
  mysql_data:
  redis_data:
